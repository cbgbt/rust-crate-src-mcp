[package]
name = "rust-crate-src"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
bon = "3.8.1"
flate2 = "1.1.5"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "0.12.0", features = ["server", "client", "transport-io", "transport-child-process"] }
anyhow = "1.0"
schemars = "1.1.0"
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.146"
snafu = "0.8.9"
tar = "0.4.44"
tokio = { version = "1.48.0", features = ["full"] }

[dev-dependencies]
anyhow = "1.0"
