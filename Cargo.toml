[package]
name = "rust-crate-src-mcp"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "An MCP server for pulling the source of crate dependencies."
repository = "https://github.com/cbgbt/rust-crate-src-mcp"
readme = "README.md"
keywords = ["mcp", "crates-io", "rust", "source"]
categories = ["development-tools"]

[dependencies]
bon = "3.8"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "0.12", features = ["server", "client", "transport-io", "transport-child-process"] }
anyhow = "1"
schemars = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0"
tar = "0"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
anyhow = "1.0"
